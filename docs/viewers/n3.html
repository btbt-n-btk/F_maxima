<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--panel:#fff;--ink:#182635;--muted:#586878;--border:#d5dee7;--blue:#126891;--amber:#a76715;--bad:#a52f3c;--good:#17664e}

<body><main>
<h1 id="heading">球・円柱接触の探索</h1>
<p>記録された配置を回転して確認し、探索の各反復を再生します。</p>
<div class="toolbar">
  <label>結果・履歴JSON<input id="file" type="file" accept=".json,application/json"></label>
  <label>表示する配置<select id="trial" disabled><option>JSONを読み込んでください</option></select></label>
  <button id="fit" type="button" disabled>視点を合わせる</button>
</div>
<div id="error" role="alert"></div>
<div class="layout">
  <div id="stage"><div id="empty">結果または探索履歴のJSONを選択</div><div id="legend">青：球　橙：円柱　ドラッグで回転・ホイールで拡大</div></div>
  <div>
    <div id="state" aria-live="polite">未読み込み</div>
    <dl class="stats">
      <div><dt>円柱高さ</dt><dd id="height">—</dd></div>
      <div><dt>現在の球半径</dt><dd id="radius">—</dd></div>
      <div><dt>最大球間重なり</dt><dd id="overlap">—</dd></div>
      <div><dt>最大円柱接触誤差</dt><dd id="contact">—</dd></div>
    </dl>
    <p id="details">—</p>
  </div>
</div>
<div class="playback">
  <button id="prev" type="button" disabled>前へ</button><button id="play" type="button" disabled>再生</button><button id="next" type="button" disabled>次へ</button>
  <span id="frame-label">—</span>
</div>
<label for="scrub" class="note">記録ステップ</label><input id="scrub" type="range" min="0" max="0" value="0" disabled>
<svg id="chart" role="img" aria-label="記録ステップに対する円柱高さ。点は現在の配置、破線は基準配置の高さ。"></svg>
<p class="note">探索途中は重なり・接触誤差を許します。縮小球での成立と、目標径での成立を区別して表示します。再生は物理時間ではなく、保存された反復の順序です。配置間の補間は行いません。</p>
<p class="note">Three.jsの読み込みにインターネット接続が必要です。最小高さの証明ではなく、数値候補を確認するための表示です。</p>
</main>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const ui = Object.fromEntries(['stage','file','trial','fit','error','empty','state','height','radius','overlap','contact','details','prev','play','next','frame-label','scrub','chart'].map(id=>[id,$(id)]));
let data=null,entries=[],frames=[],index=0,playing=false,lastTick=0,meshes=[];

if(!window.THREE||!THREE.OrbitControls){ui.error.textContent='3Dライブラリを読み込めません。ネットワーク接続を確認して再読み込みしてください。';return;}
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){ui.error.textContent='WebGLを開始できません：'+e.message;return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));ui.stage.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,0.1,5000);
camera.position.set(65,50,65);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,18,0);
scene.add(new THREE.AmbientLight(0xffffff,.75));const light=new THREE.DirectionalLight(0xffffff,.6);light.position.set(30,60,40);scene.add(light);
const sphereGeometry=new THREE.SphereGeometry(1,24,16);
const sphereMaterial=new THREE.MeshPhongMaterial({color:colors().blue,transparent:true,opacity:.5,depthWrite:false,shininess:35});
const cylinderGeometry=new THREE.CylinderGeometry(1,1,1,40);
const cylinderMaterial=new THREE.MeshPhongMaterial({color:colors().amber,transparent:true,opacity:.75,depthWrite:false});
const cylinder=new THREE.Mesh(cylinderGeometry,cylinderMaterial);cylinder.visible=false;scene.add(cylinder);
const cylinderEdges=new THREE.LineSegments(new THREE.EdgesGeometry(cylinderGeometry),new THREE.LineBasicMaterial({color:colors().amber}));cylinderEdges.visible=false;scene.add(cylinderEdges);
const floor=new THREE.GridHelper(70,14,colors().grid,colors().grid);floor.visible=false;scene.add(floor);

theme();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);

function load(raw){
  const trajectory=raw.kind==='packing_trajectory';
  const r=raw.cylinder_radius_cm,R=trajectory?raw.target_sphere_radius_cm:raw.sphere_radius_cm,n=raw.n_spheres;

  const list=[];

    if(!Array.isArray(raw.trials))throw Error('試行履歴がありません。');

  }else list.push({name:'読み込んだ結果',frames:[asFrame(raw)]});
  if(list.some(e=>e.frames.some(f=>!validateFrame(f,n))))throw Error('球中心・高さ・半径を確認してください。');
  data={r,R,n,floor:raw.floor_enabled,tolerance:raw.tolerance_cm||raw.verification?.tolerance_cm||1e-6,baselineHeight:trajectory?raw.baseline.height_cm:raw.height_cm};
  if(!Number.isFinite(data.tolerance)||data.tolerance<=0)throw Error('許容誤差が不正です。');
  document.getElementById('heading').textContent=n+'球・円柱接触の探索';document.title=n+'球・円柱接触の探索ビューア';
  entries=list;ui.trial.replaceChildren();entries.forEach((e,i)=>{const o=document.createElement('option');o.value=i;o.textContent=e.name;ui.trial.appendChild(o);});
  ui.trial.disabled=false;ui.fit.disabled=false;ui.empty.hidden=true;
  meshes.forEach(m=>scene.remove(m));meshes=Array.from({length:n},()=>{const m=new THREE.Mesh(sphereGeometry,sphereMaterial);scene.add(m);return m;});
  selectEntry(0);ui.error.textContent='';
}
function selectEntry(i){stop();frames=entries[i].frames;index=0;ui.scrub.max=frames.length-1;ui.scrub.disabled=frames.length<2;ui.play.disabled=frames.length<2;update();fitCamera();}
function measure(f){
  const R=f.sphere_radius_cm,p=f.centers_cm,h=f.height_cm;
  let gap=Infinity,err=0;for(let i=0;i<p.length;i++){const [x,y,z]=p[i];const d=Math.hypot(Math.max(Math.hypot(x,y)-data.r,0),Math.max(-z,z-h,0));err=Math.max(err,Math.abs(d-R));for(let j=0;j<i;j++)gap=Math.min(gap,Math.hypot(...p[i].map((v,k)=>v-p[j][k]))-2*R);}
  const zmin=Math.min(...p.map(p=>p[2])),floorGap=zmin-R;
  return {gap,err,floorGap,valid:gap>=-data.tolerance&&err<=data.tolerance&&zmin>=-data.tolerance&&(!data.floor||floorGap>=-data.tolerance)};
}
function fmt(x){return Math.abs(x)<.001&&x!==0?x.toExponential(2):x.toFixed(6);}
function update(){
  if(!frames.length)return;
  const f=frames[index],q=f.sphere_radius_cm/data.R,m=measure(f),target=Math.abs(q-1)<1e-12;
  meshes.forEach((mesh,i)=>{const [x,y,z]=f.centers_cm[i];mesh.position.set(x,z,y);mesh.scale.setScalar(f.sphere_radius_cm);});
  [cylinder,cylinderEdges].forEach(mesh=>{mesh.visible=true;mesh.position.set(0,f.height_cm/2,0);mesh.scale.set(data.r,f.height_cm,data.r);});floor.visible=data.floor;
  ui.height.textContent=f.height_cm.toFixed(6)+' cm';ui.radius.textContent=f.sphere_radius_cm.toFixed(4)+' cm';
  ui.overlap.textContent=fmt(Math.max(0,-m.gap))+' cm';ui.contact.textContent=fmt(m.err)+' cm';
  ui.state.textContent=m.valid?(target?'目標径で条件成立（数値検証）':'縮小球で条件成立・目標径は未確認'):'探索途中・制約違反あり';ui.state.className=m.valid&&target?'valid':'invalid';
  ui.details.textContent=`目標半径比 ${(q*100).toFixed(1)}% ／ ${data.floor?'床あり・最小隙間 '+fmt(m.floorGap)+' cm':'床なし'} ／ 許容誤差 ${data.tolerance.toExponential(0)} cm`;
  ui['frame-label'].textContent=`${index+1} / ${frames.length}　${phaseNames[f.phase]||f.phase}${f.stage?'・段階 '+f.stage:''}・反復 ${f.iteration||0}`;
  ui.scrub.value=index;ui.prev.disabled=index===0;ui.next.disabled=index===frames.length-1;drawChart();
}
function fitCamera(){
  if(!frames.length)return;const f=frames[index],R=f.sphere_radius_cm;
  const box=new THREE.Box3(new THREE.Vector3(-data.r,0,-data.r),new THREE.Vector3(data.r,f.height_cm,data.r));
  f.centers_cm.forEach(([x,y,z])=>{box.expandByPoint(new THREE.Vector3(x-R,z-R,y-R));box.expandByPoint(new THREE.Vector3(x+R,z+R,y+R));});
  const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),span=Math.max(size.y,size.x/Math.max(camera.aspect,.1),size.z/Math.max(camera.aspect,.1));
  const distance=span/(2*Math.tan(camera.fov*Math.PI/360))*1.6;controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(1,.6,1).normalize().multiplyScalar(distance));camera.far=Math.max(5000,distance*10);camera.updateProjectionMatrix();controls.update();
}
function drawChart(){
  const svg=ui.chart;svg.replaceChildren();if(!frames.length)return;
  const ns='http://www.w3.org/2000/svg',w=svg.clientWidth||600,H=190,left=62,right=w-18,top=15,bottom=151;
  svg.setAttribute('viewBox',`0 0 ${w} ${H}`);const add=(type,attrs,text)=>{const e=document.createElementNS(ns,type);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;};
  const values=frames.map(f=>f.height_cm).concat(data.baselineHeight),lo=Math.min(...values),hi=Math.max(...values),padding=Math.max((hi-lo)*.08,.05),min=lo-padding,max=hi+padding;
  const X=i=>left+(right-left)*i/Math.max(frames.length-1,1),Y=h=>bottom-(bottom-top)*(h-min)/(max-min);
  [0,.5,1].forEach(t=>{const v=min+t*(max-min),y=Y(v);add('line',{x1:left,y1:y,x2:right,y2:y,stroke:'var(--border)'});add('text',{x:left-8,y:y+4,'text-anchor':'end'},v.toFixed(2));});
  add('text',{x:4,y:12},'高さ cm');
  add('line',{x1:left,y1:Y(data.baselineHeight),x2:right,y2:Y(data.baselineHeight),stroke:'var(--amber)','stroke-dasharray':'5 4'});
  add('polyline',{points:frames.map((f,i)=>`${X(i)},${Y(f.height_cm)}`).join(' '),fill:'none',stroke:'var(--blue)','stroke-width':2});
  add('circle',{cx:X(index),cy:Y(frames[index].height_cm),r:4,fill:'var(--blue)'});
  const ticks=frames.length===1?[0]:[0,Math.floor((frames.length-1)/2),frames.length-1];[...new Set(ticks)].forEach(i=>add('text',{x:X(i),y:bottom+19,'text-anchor':'middle'},String(i+1)));
  add('text',{x:(left+right)/2,y:187,'text-anchor':'middle'},'記録ステップ（破線：基準配置）');
}
function stop(){playing=false;ui.play.textContent='再生';}
ui.file.addEventListener('change',async()=>{stop();try{const f=ui.file.files[0];if(f)load(JSON.parse(await f.text()));}catch(e){ui.error.textContent='読み込み失敗：'+e.message;}});
ui.trial.addEventListener('change',()=>selectEntry(Number(ui.trial.value)));ui.fit.addEventListener('click',fitCamera);
ui.prev.addEventListener('click',()=>{stop();index=Math.max(0,index-1);update();});ui.next.addEventListener('click',()=>{stop();index=Math.min(frames.length-1,index+1);update();});
ui.scrub.addEventListener('input',()=>{stop();index=Number(ui.scrub.value);update();});
ui.play.addEventListener('click',()=>{if(playing){stop();return;}if(index>=frames.length-1)index=0;playing=true;lastTick=performance.now();ui.play.textContent='停止';update();});
function tick(now){requestAnimationFrame(tick);if(playing&&now-lastTick>=100){index=Math.min(index+1,frames.length-1);lastTick=now;update();if(index===frames.length-1)stop();}controls.update();renderer.render(scene,camera);}
resize();requestAnimationFrame(tick);
if(window.PACKING_DATA){try{load(window.PACKING_DATA);}catch(e){ui.error.textContent='サンプルの読み込み失敗：'+e.message;}}
})();
</script>
</body></html>
